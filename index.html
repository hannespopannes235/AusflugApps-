<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>FamilienAusflug – Ausflugstipps fürs Wetter</title>
  <meta name="description" content="Wetterbasierte Ausflugstipps für Familien mit Kleinkind (2–3 Jahre)">
  <meta name="theme-color" content="#3B82F6">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --primary:        #2563EB;
      --primary-dark:   #1D4ED8;
      --primary-light:  #EFF6FF;
      --accent:         #EA580C;
      --accent-light:   #FFF7ED;
      --success:        #16A34A;
      --success-light:  #F0FDF4;
      --c-bg:           #F6F5F3;
      --c-surface:      #FFFFFF;
      --c-border:       #E6E3DF;
      --c-border-muted: #F0EEEb;
      --c-text:         #18181B;
      --c-text-2:       #52525B;
      --c-text-3:       #A1A1AA;
      --c-tag-bg:       #F4F3F1;
      --radius-sm:  8px;
      --radius-md:  14px;
      --radius-lg:  20px;
      --radius-xl:  28px;
      --shadow-xs:  0 1px 2px rgba(0,0,0,.04);
      --shadow-sm:  0 1px 3px rgba(0,0,0,.06), 0 2px 8px rgba(0,0,0,.04);
      --shadow-md:  0 4px 16px rgba(0,0,0,.08), 0 2px 4px rgba(0,0,0,.04);
      --shadow-lg:  0 16px 40px rgba(0,0,0,.1), 0 4px 8px rgba(0,0,0,.05);
      --font: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
      --ease: 200ms cubic-bezier(.4,0,.2,1);
    }

    @media (prefers-color-scheme: dark) {
      :root {
        --c-bg:           #111110;
        --c-surface:      #1C1C1A;
        --c-border:       #2E2E2C;
        --c-border-muted: #242422;
        --c-text:         #FAFAF8;
        --c-text-2:       #A8A29E;
        --c-text-3:       #57534E;
        --c-tag-bg:       #292927;
        --primary-light:  #172554;
        --success-light:  #052E16;
        --accent-light:   #1C1007;
      }
    }

    html { scroll-behavior: smooth; }

    body {
      font-family: var(--font);
      background: var(--c-bg);
      color: var(--c-text);
      min-height: 100vh;
      line-height: 1.6;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
    }

    /* ── HEADER ── */
    .app-header {
      background: linear-gradient(160deg, #0D2040 0%, #1A3A6C 55%, #1E40AF 100%);
      color: #fff;
      padding: .9rem 1.25rem 1.1rem;
      position: sticky;
      top: 0;
      z-index: 50;
      box-shadow: 0 2px 16px rgba(0,0,0,.28), 0 1px 4px rgba(0,0,0,.2);
    }

    .header-inner {
      max-width: 1100px;
      margin: 0 auto;
    }

    .header-top {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: .75rem;
    }

    .app-logo {
      font-size: 1.25rem;
      font-weight: 800;
      letter-spacing: -.025em;
      line-height: 1.1;
    }
    .app-logo span {
      font-size: .78rem;
      font-weight: 400;
      opacity: .65;
      display: block;
      letter-spacing: 0;
      margin-top: .1rem;
    }

    .location-form {
      display: flex;
      gap: .5rem;
      position: relative;
    }

    .loc-wrap {
      flex: 1;
      position: relative;
      min-width: 0;
    }

    .loc-prefix {
      position: absolute;
      left: .7rem;
      top: 50%;
      transform: translateY(-50%);
      font-size: .85rem;
      pointer-events: none;
      z-index: 1;
    }

    .loc-input {
      width: 100%;
      padding: .6rem .8rem .6rem 2rem;
      border: 1.5px solid rgba(255,255,255,.25);
      border-radius: var(--radius-sm);
      background: rgba(255,255,255,.18);
      backdrop-filter: blur(8px);
      color: #fff;
      font-size: .9rem;
      font-family: var(--font);
      outline: none;
      transition: background var(--ease), border-color var(--ease);
    }
    .loc-input::placeholder { color: rgba(255,255,255,.65); }
    .loc-input:focus {
      background: rgba(255,255,255,.28);
      border-color: rgba(255,255,255,.55);
    }

    .btn {
      display: inline-flex;
      align-items: center;
      gap: .3rem;
      padding: .58rem 1rem;
      border: none;
      border-radius: var(--radius-sm);
      font-family: var(--font);
      font-size: .85rem;
      font-weight: 600;
      cursor: pointer;
      transition: all var(--ease);
      white-space: nowrap;
      user-select: none;
    }
    .btn:active { transform: scale(.97); }

    .btn-white { background: #fff; color: var(--primary); }
    .btn-white:hover { background: #EFF6FF; }

    .btn-ghost {
      background: rgba(255,255,255,.18);
      color: #fff;
      border: 1.5px solid rgba(255,255,255,.25);
      padding: .58rem .75rem;
    }
    .btn-ghost:hover { background: rgba(255,255,255,.28); }
    .geo-btn-txt { font-size: .82rem; }
    @media (max-width: 420px) { .geo-btn-txt { display: none; } }

    .btn-primary { background: var(--primary); color: #fff; }
    .btn-primary:hover { background: var(--primary-dark); box-shadow: var(--shadow-md); }

    .autocomplete {
      position: absolute;
      top: calc(100% + 5px);
      left: 0; right: 0;
      background: var(--c-surface);
      border-radius: var(--radius-sm);
      box-shadow: var(--shadow-lg);
      z-index: 200;
      overflow: hidden;
      max-height: 220px;
      overflow-y: auto;
      border: 1px solid var(--c-border);
    }

    .ac-item {
      padding: .6rem .9rem;
      cursor: pointer;
      color: var(--c-text-2);
      font-size: .875rem;
      border-bottom: 1px solid var(--c-border-muted);
      transition: background var(--ease);
    }
    .ac-item:last-child { border-bottom: none; }
    .ac-item:hover { background: var(--c-bg); color: var(--c-text); }

    /* ── MAIN ── */
    .main {
      max-width: 1100px;
      margin: 0 auto;
      padding: 1.25rem;
    }

    /* ── LOCATION PROMPT ── */
    .loc-prompt {
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
      padding: 3.5rem 1.5rem;
      gap: 1rem;
      animation: fadeUp .35s ease both;
    }
    .loc-prompt-icon { font-size: 3.5rem; }
    .loc-prompt h2 { font-size: 1.4rem; font-weight: 700; color: var(--c-text); }
    .loc-prompt p { color: var(--c-text-3); font-size: .95rem; max-width: 380px; line-height: 1.6; }

    /* ── LOADING ── */
    .loading {
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 4rem 2rem;
      gap: 1rem;
      color: var(--c-text-3);
    }
    .loading p { font-size: .9rem; }
    .spinner {
      width: 40px; height: 40px;
      border: 3px solid var(--c-border);
      border-top-color: var(--primary);
      border-radius: 50%;
      animation: spin .8s linear infinite;
    }

    /* ── ERROR ── */
    .error-bar {
      display: flex;
      align-items: flex-start;
      gap: .75rem;
      background: #FEF2F2;
      border: 1px solid #FECACA;
      border-radius: var(--radius-md);
      padding: 1rem 1.25rem;
      color: #991B1B;
      font-size: .88rem;
      line-height: 1.5;
      margin-bottom: 1.25rem;
      animation: fadeUp .25s ease;
    }
    .error-bar .err-close {
      margin-left: auto;
      flex-shrink: 0;
      background: none;
      border: none;
      color: #991B1B;
      cursor: pointer;
      font-size: 1rem;
      padding: 0;
      opacity: .6;
    }
    .error-bar .err-close:hover { opacity: 1; }
    @media (prefers-color-scheme: dark) {
      .error-bar { background: #2C0A0A; border-color: #7F1D1D; color: #FCA5A5; }
      .error-bar .err-close { color: #FCA5A5; }
    }

    /* ── WEATHER CARD ── */
    .weather-section { margin-bottom: 1rem; animation: fadeUp .35s ease both; }

    .weather-card {
      border-radius: var(--radius-lg);
      padding: 1.6rem 1.75rem;
      color: #fff;
      position: relative;
      overflow: hidden;
      margin-bottom: .75rem;
      box-shadow: var(--shadow-lg);
    }
    .weather-card::before {
      content: '';
      position: absolute;
      inset: 0;
      background: linear-gradient(180deg, rgba(255,255,255,.07) 0%, transparent 60%);
      pointer-events: none;
    }
    .weather-card::after {
      content: attr(data-weather-icon);
      position: absolute;
      right: 1.25rem;
      bottom: -.5rem;
      font-size: 8rem;
      opacity: .15;
      line-height: 1;
      pointer-events: none;
      user-select: none;
      filter: drop-shadow(0 4px 8px rgba(0,0,0,.2));
    }

    .wc-sunny   { background: linear-gradient(145deg, #FB923C 0%, #EA580C 50%, #C2410C 100%); }
    .wc-partly  { background: linear-gradient(145deg, #38BDF8 0%, #0284C7 50%, #0369A1 100%); }
    .wc-cloudy  { background: linear-gradient(145deg, #78716C 0%, #57534E 50%, #44403C 100%); }
    .wc-foggy   { background: linear-gradient(145deg, #9CA3AF 0%, #6B7280 50%, #4B5563 100%); }
    .wc-drizzle { background: linear-gradient(145deg, #60A5FA 0%, #2563EB 50%, #1D4ED8 100%); }
    .wc-rainy   { background: linear-gradient(145deg, #3B82F6 0%, #1D4ED8 50%, #1E3A8A 100%); }
    .wc-snowy   { background: linear-gradient(145deg, #BAE6FD 0%, #7DD3FC 50%, #38BDF8 100%); color: #0C4A6E !important; }
    .wc-stormy  { background: linear-gradient(145deg, #4C1D95 0%, #312E81 50%, #1E1B4B 100%); }

    .wc-day-badge {
      display: inline-block;
      font-size: .7rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: .1em;
      background: rgba(255,255,255,.2);
      backdrop-filter: blur(4px);
      padding: .18rem .65rem;
      border-radius: 100px;
      margin-bottom: 1rem;
    }

    .wc-main {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      margin-bottom: .85rem;
    }

    .wc-temp {
      font-size: 4.5rem;
      font-weight: 800;
      letter-spacing: -.05em;
      line-height: 1;
    }
    .wc-feels {
      font-size: .8rem;
      opacity: .75;
      margin-top: .3rem;
      font-weight: 400;
    }

    .wc-right { text-align: right; }
    .wc-icon { font-size: 3.5rem; line-height: 1; display: block; }
    .wc-label {
      font-size: .9rem;
      font-weight: 600;
      opacity: .9;
      margin-top: .35rem;
    }

    .wc-details {
      display: flex;
      flex-wrap: wrap;
      gap: .5rem;
      margin-top: .85rem;
      padding-top: .85rem;
      border-top: 1px solid rgba(255,255,255,.18);
    }
    .wc-detail {
      display: flex;
      align-items: center;
      gap: .35rem;
      font-size: .82rem;
      font-weight: 500;
      opacity: .88;
    }
    .wc-detail-sep {
      width: 1px; height: 14px;
      background: rgba(255,255,255,.25);
      margin: 0 .1rem;
    }

    .wc-minmax {
      display: inline-flex;
      align-items: center;
      gap: .5rem;
      font-size: .85rem;
      font-weight: 600;
      background: rgba(255,255,255,.18);
      backdrop-filter: blur(4px);
      padding: .3rem .8rem;
      border-radius: 100px;
      margin-top: .75rem;
    }
    .wc-minmax span { opacity: .6; font-weight: 400; font-size: .75rem; }

    /* ── FORECAST SECTION ── */
    .forecast-section {
      margin-top: 1.75rem;
      animation: fadeUp .35s .2s ease both;
    }

    .section-label {
      font-size: .72rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: .09em;
      color: var(--c-text-3);
      margin-bottom: .65rem;
      padding-left: .1rem;
    }

    .forecast-strip {
      display: flex;
      gap: .5rem;
      overflow-x: auto;
      padding-bottom: 4px;
      scrollbar-width: none;
    }
    .forecast-strip::-webkit-scrollbar { display: none; }

    @media (min-width: 640px) {
      .forecast-strip { display: grid; grid-template-columns: repeat(5, 1fr); }
    }

    .fc-day {
      flex: 0 0 82px;
      background: var(--c-surface);
      border-radius: var(--radius-md);
      padding: .8rem .6rem;
      text-align: center;
      cursor: pointer;
      border: 2px solid transparent;
      box-shadow: var(--shadow-sm);
      transition: all var(--ease);
    }
    .fc-day:hover { transform: translateY(-2px); box-shadow: var(--shadow-md); }
    .fc-day.active {
      border-color: var(--primary);
      background: var(--primary-light);
      box-shadow: 0 0 0 3px rgba(37,99,235,.12);
    }

    .fc-name {
      font-size: .68rem;
      font-weight: 700;
      color: var(--c-text-3);
      text-transform: uppercase;
      letter-spacing: .07em;
      margin-bottom: .3rem;
    }
    .fc-day.active .fc-name { color: var(--primary); }

    .fc-icon { font-size: 1.6rem; display: block; margin-bottom: .3rem; }

    .fc-temp { font-size: .78rem; color: var(--c-text-2); font-weight: 500; }
    .fc-temp b { color: var(--c-text); font-weight: 700; }

    .fc-rain { font-size: .68rem; color: #3B82F6; margin-top: .15rem; font-weight: 500; }

    /* ── RECOMMENDATION BANNER ── */
    .rec-banner {
      background: var(--c-surface);
      border-radius: var(--radius-lg);
      padding: 1.25rem 1.5rem;
      margin-bottom: 1.25rem;
      box-shadow: var(--shadow-sm);
      border: 1px solid var(--c-border);
      border-left-width: 4px;
      display: flex;
      align-items: center;
      gap: 1rem;
      animation: fadeUp .35s .05s ease both;
    }
    .rec-banner.good  { border-left-color: var(--success); }
    .rec-banner.mixed { border-left-color: var(--accent); }
    .rec-banner.bad   { border-left-color: var(--primary); }

    .rec-icon-wrap {
      flex-shrink: 0;
      width: 3rem; height: 3rem;
      border-radius: var(--radius-sm);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.6rem;
    }
    .rec-banner.good  .rec-icon-wrap { background: var(--success-light); }
    .rec-banner.mixed .rec-icon-wrap { background: var(--accent-light); }
    .rec-banner.bad   .rec-icon-wrap { background: var(--primary-light); }

    .rec-body { flex: 1; min-width: 0; }

    .rec-label {
      font-size: .68rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: .1em;
      color: var(--c-text-3);
      margin-bottom: .25rem;
    }
    .rec-title {
      font-size: 1.05rem;
      font-weight: 700;
      color: var(--c-text);
      line-height: 1.25;
    }
    .rec-sub {
      font-size: .82rem;
      color: var(--c-text-3);
      margin-top: .2rem;
    }

    /* ── FILTERS ── */
    .filters-section {
      margin-bottom: 1.5rem;
      background: var(--c-surface);
      border: 1px solid var(--c-border);
      border-radius: var(--radius-lg);
      padding: 1rem 1.25rem;
      box-shadow: var(--shadow-xs);
      display: flex;
      flex-direction: column;
      gap: .65rem;
      animation: fadeUp .35s .1s ease both;
    }

    .filter-row {
      display: flex;
      gap: .4rem;
      flex-wrap: wrap;
      align-items: center;
    }

    .filter-label {
      font-size: .68rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: .09em;
      color: var(--c-text-3);
      flex-shrink: 0;
      min-width: 52px;
    }

    .chip {
      padding: .33rem .78rem;
      border-radius: 100px;
      border: 1.5px solid var(--c-border);
      background: var(--c-bg);
      color: var(--c-text-2);
      font-size: .79rem;
      font-weight: 500;
      font-family: var(--font);
      cursor: pointer;
      transition: all var(--ease);
      white-space: nowrap;
      line-height: 1.4;
    }
    .chip:hover {
      border-color: var(--primary);
      color: var(--primary);
      background: var(--primary-light);
    }
    .chip.active {
      background: var(--primary);
      border-color: var(--primary);
      color: #fff;
      box-shadow: 0 1px 4px rgba(37,99,235,.3);
    }

    .filter-sep {
      width: 100%;
      height: 1px;
      background: var(--c-border-muted);
    }

    .btn-shuffle {
      margin-left: auto;
      background: var(--c-bg);
      color: var(--c-text-2);
      border: 1.5px solid var(--c-border);
      border-radius: 100px;
      padding: .33rem .85rem;
      font-family: var(--font);
      font-size: .79rem;
      font-weight: 600;
      cursor: pointer;
      transition: all var(--ease);
      display: inline-flex;
      align-items: center;
      gap: .3rem;
    }
    .btn-shuffle:hover {
      border-color: var(--accent);
      color: var(--accent);
      background: var(--accent-light);
    }
    .btn-shuffle:active { transform: scale(.97); }

    .shuffle-icon { display: inline-block; }
    .btn-shuffle.spinning .shuffle-icon { animation: spin-once .45s ease; }

    .btn-reset {
      background: none;
      color: var(--c-text-3);
      border: none;
      border-radius: 100px;
      padding: .33rem .7rem;
      font-family: var(--font);
      font-size: .78rem;
      font-weight: 500;
      cursor: pointer;
      transition: all var(--ease);
      text-decoration: underline;
      text-underline-offset: 2px;
    }
    .btn-reset:hover { color: var(--c-text-2); }

    /* ── OUTINGS SECTION ── */
    .outings-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 1rem;
      animation: fadeUp .35s .15s ease both;
    }
    .section-title {
      font-size: .88rem;
      font-weight: 700;
      color: var(--c-text-2);
      text-transform: uppercase;
      letter-spacing: .07em;
    }
    .count-pill {
      background: var(--c-tag-bg);
      color: var(--c-text-3);
      font-size: .73rem;
      font-weight: 600;
      padding: .18rem .6rem;
      border-radius: 100px;
    }

    /* ── OUTINGS GRID ── */
    .outings-grid {
      display: grid;
      grid-template-columns: 1fr;
      gap: 1rem;
    }
    @media (min-width: 580px)  { .outings-grid { grid-template-columns: repeat(2, 1fr); } }
    @media (min-width: 900px)  { .outings-grid { grid-template-columns: repeat(3, 1fr); } }

    .empty-state {
      background: var(--c-surface);
      border: 1px solid var(--c-border);
      border-radius: var(--radius-lg);
      text-align: center;
      padding: 3rem 1.5rem;
      color: var(--c-text-3);
      animation: fadeUp .25s ease;
    }
    .empty-state .es-icon { font-size: 2.25rem; margin-bottom: .75rem; display: block; }
    .empty-state p { line-height: 1.6; }

    /* ── OUTING CARD ── */
    .outing-card {
      background: var(--c-surface);
      border-radius: var(--radius-lg);
      border: 1px solid var(--c-border);
      box-shadow: var(--shadow-sm);
      display: flex;
      flex-direction: column;
      transition: transform var(--ease), box-shadow var(--ease);
      animation: fadeUp .35s ease both;
      overflow: hidden;
      position: relative;
    }
    .outing-card:hover {
      transform: translateY(-3px);
      box-shadow: var(--shadow-lg);
      border-color: transparent;
    }

    /* Colored top accent stripe per tier */
    .outing-card::before {
      content: '';
      display: block;
      height: 3px;
      background: var(--c-border);
      border-radius: 100px 100px 0 0;
    }
    .outing-card.tier-high::before { background: var(--success); }
    .outing-card.tier-mid::before  { background: var(--accent); }
    .outing-card.tier-low {
      opacity: .72;
      filter: grayscale(.2);
    }
    .outing-card.tier-low:hover { opacity: 1; filter: none; }

    .card-header {
      padding: 1rem 1.1rem 0;
      display: flex;
      align-items: flex-start;
      gap: .65rem;
    }

    .card-icon { font-size: 2.1rem; line-height: 1; flex-shrink: 0; margin-top: .1rem; }

    .card-title-wrap { flex: 1; min-width: 0; }
    .card-title {
      font-size: 1rem;
      font-weight: 700;
      color: var(--c-text);
      line-height: 1.3;
      letter-spacing: -.01em;
    }

    .score-pill {
      display: inline-flex;
      align-items: center;
      gap: .2rem;
      font-size: .68rem;
      font-weight: 600;
      padding: .12rem .48rem;
      border-radius: 100px;
      margin-top: .22rem;
    }
    .score-pill.high { background: var(--success-light); color: var(--success); }
    .score-pill.mid  { background: var(--accent-light);  color: var(--accent); }
    .score-pill.low  { background: var(--c-tag-bg);      color: var(--c-text-3); }

    .fav-btn {
      flex-shrink: 0;
      background: none;
      border: none;
      font-size: 1.15rem;
      cursor: pointer;
      color: var(--c-border);
      padding: .15rem;
      margin-top: -.1rem;
      transition: color var(--ease), transform var(--ease);
      line-height: 1;
    }
    .fav-btn:hover { color: var(--accent); transform: scale(1.25); }
    .fav-btn.on    { color: var(--accent); }

    .card-desc {
      flex: 1;
      padding: .7rem 1.1rem;
      font-size: .855rem;
      color: var(--c-text-2);
      line-height: 1.6;
    }

    .card-tags {
      padding: 0 1.1rem .7rem;
      display: flex;
      flex-wrap: wrap;
      gap: .3rem;
    }
    .tag {
      background: var(--c-tag-bg);
      color: var(--c-text-3);
      font-size: .68rem;
      font-weight: 500;
      padding: .17rem .5rem;
      border-radius: 100px;
    }
    .tag.free {
      background: #F0FDF4;
      color: var(--success);
      font-weight: 600;
    }
    @media (prefers-color-scheme: dark) { .tag.free { background: #052E16; color: #4ADE80; } }

    .card-meta {
      padding: .6rem 1.1rem;
      border-top: 1px solid var(--c-border-muted);
      display: flex;
      flex-wrap: wrap;
      gap: .45rem .75rem;
      align-items: center;
    }
    .meta-item {
      font-size: .77rem;
      color: var(--c-text-3);
      display: flex;
      align-items: center;
      gap: .2rem;
    }

    .card-tip {
      background: var(--c-tag-bg);
      border-top: 1px solid var(--c-border-muted);
      padding: .7rem 1.1rem;
      display: flex;
      align-items: flex-start;
      gap: .5rem;
      font-size: .8rem;
      color: var(--c-text-2);
      line-height: 1.5;
      font-style: italic;
    }
    .tip-icon { flex-shrink: 0; margin-top: .05rem; font-style: normal; }

    /* ── LOCATION BAR ── */
    .loc-bar {
      background: var(--c-surface);
      border: 1px solid var(--c-border);
      border-radius: var(--radius-md);
      padding: .6rem .9rem;
      display: flex;
      align-items: center;
      gap: .6rem;
      box-shadow: var(--shadow-xs);
      margin-bottom: .75rem;
    }

    .loc-bar-icon { font-size: 1rem; flex-shrink: 0; }

    .loc-bar-info { flex: 1; min-width: 0; }

    .loc-bar-name {
      font-size: .88rem;
      font-weight: 600;
      color: var(--c-text);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      display: block;
    }

    .loc-bar-sub {
      font-size: .72rem;
      color: var(--c-text-3);
    }

    .loc-source-tag {
      font-size: .68rem;
      font-weight: 700;
      padding: .13rem .5rem;
      border-radius: 100px;
      background: var(--accent-light);
      color: #92400E;
      flex-shrink: 0;
      letter-spacing: .03em;
    }
    .loc-source-tag.gps { background: var(--success-light); color: var(--success); }
    @media (prefers-color-scheme: dark) {
      .loc-source-tag     { color: var(--accent); }
      .loc-source-tag.gps { color: var(--success); }
    }

    .loc-bar-change {
      background: none;
      border: none;
      font-family: var(--font);
      font-size: .78rem;
      color: var(--primary);
      cursor: pointer;
      padding: .22rem .4rem;
      border-radius: 4px;
      flex-shrink: 0;
      transition: background var(--ease);
      white-space: nowrap;
    }
    .loc-bar-change:hover { background: var(--primary-light); }

    /* ── GEO CTA ── */
    .geo-cta {
      display: flex;
      align-items: center;
      gap: .85rem;
      background: var(--success-light);
      border: 1px solid rgba(16,185,129,.22);
      border-radius: var(--radius-md);
      padding: .9rem 1rem;
      margin-bottom: .75rem;
      animation: fadeUp .3s ease;
    }

    .geo-cta-icon { font-size: 1.55rem; flex-shrink: 0; }

    .geo-cta-body { flex: 1; min-width: 0; }

    .geo-cta-title {
      font-size: .88rem;
      font-weight: 700;
      color: var(--c-text);
      margin-bottom: .1rem;
    }

    .geo-cta-sub {
      font-size: .78rem;
      color: var(--c-text-3);
      line-height: 1.4;
    }

    .geo-cta-btn {
      background: var(--success);
      color: #fff;
      border: none;
      border-radius: var(--radius-sm);
      padding: .55rem .95rem;
      font-family: var(--font);
      font-size: .82rem;
      font-weight: 600;
      cursor: pointer;
      transition: all var(--ease);
      white-space: nowrap;
      flex-shrink: 0;
    }
    .geo-cta-btn:hover  { background: #059669; transform: translateY(-1px); box-shadow: var(--shadow-sm); }
    .geo-cta-btn:active { transform: scale(.97); }
    .geo-cta-btn:disabled { opacity: .55; cursor: default; transform: none; box-shadow: none; }

    @media (max-width: 460px) {
      .geo-cta { flex-wrap: wrap; }
      .geo-cta-btn { width: 100%; text-align: center; }
    }

    /* ── FOOTER ── */
    .app-footer {
      text-align: center;
      padding: 2.5rem 1.25rem;
      color: var(--c-text-3);
      font-size: .78rem;
      border-top: 1px solid var(--c-border-muted);
    }
    .app-footer a { color: var(--primary); text-decoration: none; }
    .app-footer a:hover { text-decoration: underline; }

    /* ── ANIMATIONS ── */
    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(10px); }
      to   { opacity: 1; transform: translateY(0); }
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    @keyframes spin-once { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }
  </style>

        desc: 'Bei warmem Sommerwetter ist das Planschbecken im eigenen Garten oder auf dem Balkon der absolute Favorit. Mit Sand buddeln, Wasser schütten und matschen – Kinder-Glück pur.',
        category: 'outdoor',
        tags: ['kostenlos', 'wasser', 'kreativ', 'bewegung'],
        duration: 'ganztags',
        energy: 'aktiv',
        ideal:  ['sunny'],
        ok:     ['partly_cloudy'],
        avoid:  ['rainy', 'stormy', 'snowy', 'drizzle', 'cloudy', 'foggy'],
        minTemp: 22, maxTemp: 35, maxWind: 18, maxRain: 10,
        tips: [
          'Sonnencreme alle 2 Stunden erneuern',
          'Sonnensegel für ausreichend Schatten aufstellen',
          'Viel Trinken nicht vergessen!'
        ]
      }
    ];

    /* ================================================================
       CONSTANTS
    ================================================================ */
    const CONDITIONS = {
      sunny:        { label: 'Sonnig',          icon: '☀️',  cls: 'wc-sunny'   },
      partly_cloudy:{ label: 'Teilw. bewölkt',  icon: '⛅',  cls: 'wc-partly'  },
      cloudy:       { label: 'Bewölkt',          icon: '☁️',  cls: 'wc-cloudy'  },
      foggy:        { label: 'Neblig',           icon: '🌫️', cls: 'wc-foggy'   },
      drizzle:      { label: 'Nieselregen',      icon: '🌦️', cls: 'wc-drizzle' },
      rainy:        { label: 'Regnerisch',       icon: '🌧️', cls: 'wc-rainy'   },
      snowy:        { label: 'Schnee',           icon: '❄️',  cls: 'wc-snowy'   },
      stormy:       { label: 'Gewitter',         icon: '⛈️', cls: 'wc-stormy'  }
    };

    const DURATION_MAP = {
      kurz:     '⏱ Unter 1 Std.',
      mittel:   '⏱ 1–3 Std.',
      ganztags: '⏱ Ganztags'
    };

    const ENERGY_MAP = {
      ruhig:     '😌 Entspannt',
      aktiv:     '🏃 Aktiv',
      sehr_aktiv:'⚡ Sehr aktiv'
    };

    const WEEKDAYS = ['So', 'Mo', 'Di', 'Mi', 'Do', 'Fr', 'Sa'];

    /* ================================================================
       STATE
    ================================================================ */
    const S = {
      location:    null,
      weatherRaw:  null,
      weather:     null,
      forecast:    [],
      activeDay:   0,
      filter:      { type: 'all', duration: 'all', energy: 'all' },
      favorites:   JSON.parse(localStorage.getItem('fav_v1') || '[]'),
      seed:        0,
      loading:     false,
      error:       null
    };

    /* ================================================================
       API
    ================================================================ */
    async function geocode(query) {
      const url = `https://geocoding-api.open-meteo.com/v1/search?name=${encodeURIComponent(query)}&count=5&language=de&format=json`;
      const r = await fetch(url);
      if (!r.ok) throw new Error('Geocoding fehlgeschlagen');
      const d = await r.json();
      return d.results || [];
    }

    async function reverseGeocode(lat, lon) {
      const url = `https://nominatim.openstreetmap.org/reverse?lat=${lat}&lon=${lon}&format=json&accept-language=de`;
      const r = await fetch(url, { headers: { 'Accept-Language': 'de' } });
      const d = await r.json();
      return d.address?.city || d.address?.town || d.address?.village || 'Mein Standort';
    }

    async function fetchWeather(lat, lon) {
      const p = new URLSearchParams({
        latitude: lat,
        longitude: lon,
        current: 'temperature_2m,apparent_temperature,weather_code,wind_speed_10m,relative_humidity_2m',
        daily: 'weather_code,temperature_2m_max,temperature_2m_min,precipitation_probability_max,wind_speed_10m_max',
        timezone: 'auto',
        forecast_days: 5,
        wind_speed_unit: 'kmh'
      });
      const r = await fetch(`https://api.open-meteo.com/v1/forecast?${p}`);
      if (!r.ok) throw new Error('Wetterdaten konnten nicht geladen werden');
      return r.json();
    }

    function conditionFromCode(code) {
      if (code === 0)                          return 'sunny';
      if (code === 1 || code === 2)            return 'partly_cloudy';
      if (code === 3)                          return 'cloudy';
      if (code === 45 || code === 48)          return 'foggy';
      if (code >= 51 && code <= 57)            return 'drizzle';
      if ((code >= 61 && code <= 67) || (code >= 80 && code <= 82)) return 'rainy';
      if ((code >= 71 && code <= 77) || (code >= 85 && code <= 86)) return 'snowy';
      if (code >= 95)                          return 'stormy';
      return 'cloudy';
    }

    function parseWeather(raw, dayIdx) {
      const c = raw.current;
      const d = raw.daily;
      const rain = d.precipitation_probability_max[dayIdx] ?? 0;
      const wind = Math.round(d.wind_speed_10m_max[dayIdx] ?? 0);

      if (dayIdx === 0) {
        return {
          temp:      Math.round(c.temperature_2m),
          feels:     Math.round(c.apparent_temperature),
          condition: conditionFromCode(c.weather_code),
          wind:      Math.round(c.wind_speed_10m),
          rain:      rain,
          humidity:  c.relative_humidity_2m,
          tMin:      Math.round(d.temperature_2m_min[0]),
          tMax:      Math.round(d.temperature_2m_max[0])
        };
      }
      const tMin = Math.round(d.temperature_2m_min[dayIdx]);
      const tMax = Math.round(d.temperature_2m_max[dayIdx]);
      return {
        temp:      Math.round((tMax + tMin) / 2),
        feels:     Math.round((tMax + tMin) / 2) - 2,
        condition: conditionFromCode(d.weather_code[dayIdx]),
        wind,
        rain,
        humidity:  null,
        tMin,
        tMax
      };
    }

    function parseForecast(raw) {
      return raw.daily.time.map((dateStr, i) => ({
        date:      new Date(dateStr + 'T12:00:00'),
        condition: conditionFromCode(raw.daily.weather_code[i]),
        tMin:      Math.round(raw.daily.temperature_2m_min[i]),
        tMax:      Math.round(raw.daily.temperature_2m_max[i]),
        rain:      raw.daily.precipitation_probability_max[i] ?? 0
      }));
    }

    /* ================================================================
       SCORING
    ================================================================ */
    function scoreOuting(o, w) {
      let s = 50;
      const { condition, temp, wind, rain } = w;

      if      (o.ideal.includes(condition)) s += 35;
      else if (o.ok.includes(condition))    s += 10;
      else if (o.avoid.includes(condition)) s -= 45;

      if (o.minTemp !== null && temp < o.minTemp)
        s -= Math.min(28, (o.minTemp - temp) * 2.5);
      if (o.maxTemp !== null && temp > o.maxTemp)
        s -= Math.min(15, (temp - o.maxTemp) * 2);
      if (o.maxWind !== null && wind > o.maxWind)
        s -= Math.min(20, (wind - o.maxWind) * 1.2);
      if (o.category === 'outdoor' && o.maxRain !== null && rain > o.maxRain)
        s -= Math.min(25, (rain - o.maxRain) * 0.45);

      if (o.category === 'indoor' && ['rainy','stormy','snowy','drizzle'].includes(condition))
        s += 15;
      if (o.category === 'outdoor' && condition === 'sunny')
        s += 5;

      return Math.max(0, Math.min(100, Math.round(s)));
    }

    function tier(score) {
      if (score >= 75) return 'high';
      if (score >= 45) return 'mid';
      return 'low';
    }

    function scoreLabel(score) {
      if (score >= 75) return '✓ Perfekt geeignet';
      if (score >= 45) return '~ Gut geeignet';
      return '✗ Eher ungünstig';
    }

    function seededShuffle(arr, seed) {
      const a = [...arr];
      let s = seed | 1;
      for (let i = a.length - 1; i > 0; i--) {
        s = (Math.imul(1664525, s) + 1013904223) >>> 0;
        const j = s % (i + 1);
        [a[i], a[j]] = [a[j], a[i]];
      }
      return a;
    }

    function applyFilters(w) {
      const { type, duration, energy } = S.filter;
      let list = OUTINGS.filter(o => {
        if (type === 'outdoor'   && o.category === 'indoor')  return false;
        if (type === 'indoor'    && o.category === 'outdoor') return false;
        if (type === 'favorites' && !S.favorites.includes(o.id)) return false;
        if (duration !== 'all'   && o.duration !== duration)  return false;
        if (energy !== 'all'     && o.energy !== energy)      return false;
        return true;
      });

      list = list.map(o => ({ ...o, score: scoreOuting(o, w) }));

      const high = seededShuffle(list.filter(o => o.score >= 75), S.seed);
      const mid  = seededShuffle(list.filter(o => o.score >= 45 && o.score < 75), S.seed + 1);
      const low  = seededShuffle(list.filter(o => o.score < 45), S.seed + 2);

      return [...high, ...mid, ...low];
    }

    /* ================================================================
       RENDER
    ================================================================ */
    function render() {
      const root = document.getElementById('appMain');

      if (S.loading) {
        root.innerHTML = `
          <div class="loading">
            <div class="spinner"></div>
            <p>Wetterdaten werden geladen…</p>
          </div>`;
        return;
      }

      if (!S.location) {
        root.innerHTML = `
          <div class="loc-prompt">
            <span class="loc-prompt-icon">🗺️</span>
            <h2>Wo seid ihr heute?</h2>
            <p>Gebt oben euren Ort ein oder nutzt die automatische Standortermittlung – und bekommt sofort passende Ausflugstipps.</p>
            <button class="btn btn-primary" onclick="document.getElementById('locInput').focus()">
              📍 Ort eingeben
            </button>
          </div>`;
        return;
      }

      let html = '';

      if (S.error) {
        html += `<div class="error-bar">⚠️ <span>${escHtml(S.error)}</span><button class="err-close" id="errClose" title="Schließen">✕</button></div>`;
      }

      if (S.weather) {
        html += renderWeather();
        html += renderBanner();
        html += renderFilters();
        html += renderOutings();
        html += renderForecast();
      }

      root.innerHTML = html;
      bindDynamic();
    }

    function renderWeather() {
      const w = S.weather;
      const cond = CONDITIONS[w.condition] || CONDITIONS.cloudy;
      const dayLabel = S.activeDay === 0 ? 'Heute' : S.activeDay === 1 ? 'Morgen' : WEEKDAYS[S.forecast[S.activeDay]?.date.getDay()];
      const source = S.location?.source || 'manual';

      return `
        <div class="weather-section">
          <div class="weather-card ${cond.cls}" data-weather-icon="${cond.icon}">
            <div class="wc-day-badge">${dayLabel}</div>
            <div class="wc-main">
              <div>
                <div class="wc-temp">${w.temp}°<span style="font-size:2rem;font-weight:600;opacity:.7">C</span></div>
                <div class="wc-feels">Gefühlt ${w.feels}°C</div>
              </div>
              <div class="wc-right">
                <span class="wc-icon">${cond.icon}</span>
                <div class="wc-label">${cond.label}</div>
              </div>
            </div>
            <div class="wc-details">
              <span class="wc-detail">💨 ${w.wind} km/h</span>
              <span class="wc-detail-sep"></span>
              <span class="wc-detail">🌧 ${w.rain}%</span>
              ${w.humidity !== null ? `<span class="wc-detail-sep"></span><span class="wc-detail">💧 ${w.humidity}%</span>` : ''}
            </div>
            <div class="wc-minmax">
              ↑ ${w.tMax}°C <span>max</span>
              &nbsp;&nbsp;
              ↓ ${w.tMin}°C <span>min</span>
            </div>
          </div>
          ${renderLocBar(source)}
          ${source === 'default' ? renderGeoCta() : ''}
        </div>`;
    }

    function renderForecast() {
      if (!S.forecast.length) return '';
      const forecastHtml = S.forecast.map((day, i) => {
        const dc = CONDITIONS[day.condition] || CONDITIONS.cloudy;
        const name = i === 0 ? 'Heute' : i === 1 ? 'Morgen' : WEEKDAYS[day.date.getDay()];
        return `
          <div class="fc-day ${S.activeDay === i ? 'active' : ''}" data-day="${i}">
            <div class="fc-name">${name}</div>
            <span class="fc-icon">${dc.icon}</span>
            <div class="fc-temp"><b>${day.tMax}°</b> / ${day.tMin}°</div>
            <div class="fc-rain">💧 ${day.rain}%</div>
          </div>`;
      }).join('');

      return `
        <div class="forecast-section">
          <div class="section-label">5-Tage-Vorhersage</div>
          <div class="forecast-strip">${forecastHtml}</div>
        </div>`;
    }

    function renderBanner() {
      const w = S.weather;
      const list = applyFilters(w);
      if (!list.length) return '';
      const best = list[0];

      const isBad  = ['rainy', 'stormy', 'snowy', 'drizzle'].includes(w.condition);
      const isGood = ['sunny', 'partly_cloudy'].includes(w.condition);

      let cls, icon, label, sub;

      if (best.score >= 75) {
        cls = 'good'; icon = best.icon; label = 'Empfehlung des Tages';
        sub = isGood ? 'Perfektes Wetter für diesen Ausflug!' : 'Heute besonders empfehlenswert.';
      } else if (isBad) {
        cls = 'bad'; icon = best.icon; label = 'Drinnen-Tag';
        sub = 'Bei diesem Wetter die beste Wahl für euch.';
      } else {
        cls = 'mixed'; icon = best.icon; label = 'Tipp für heute';
        sub = 'Passt gut zum heutigen Wetter.';
      }

      return `
        <div class="rec-banner ${cls}">
          <div class="rec-icon-wrap">${icon}</div>
          <div class="rec-body">
            <div class="rec-label">${label}</div>
            <div class="rec-title">${best.title}</div>
            <div class="rec-sub">${sub}</div>
          </div>
        </div>`;
    }

    function renderFilters() {
      const f = S.filter;

      function chips(key, options) {
        return options.map(([val, lbl]) =>
          `<button class="chip ${f[key] === val ? 'active' : ''}" data-fkey="${key}" data-fval="${val}">${lbl}</button>`
        ).join('');
      }

      const typeChips = chips('type', [
        ['all',       '🗂 Alle'],
        ['outdoor',   '🌿 Draußen'],
        ['indoor',    '🏠 Drinnen'],
        ['favorites', '⭐ Favoriten']
      ]);

      const durChips = chips('duration', [
        ['all',      'Alle Zeiten'],
        ['kurz',     '⏱ Kurz'],
        ['mittel',   '⏱ Mittel'],
        ['ganztags', '⏱ Ganztags']
      ]);

      const engChips = chips('energy', [
        ['all',       'Alle Level'],
        ['ruhig',     '😌 Entspannt'],
        ['aktiv',     '🏃 Aktiv'],
        ['sehr_aktiv','⚡ Sehr aktiv']
      ]);

      const isFiltered = f.type !== 'all' || f.duration !== 'all' || f.energy !== 'all';

      return `
        <div class="filters-section">
          <div class="filter-row">
            <span class="filter-label">Wo</span>
            ${typeChips}
            <button class="btn-shuffle" id="shuffleBtn">
              <span class="shuffle-icon">🔀</span> Mischen
            </button>
          </div>
          <div class="filter-sep"></div>
          <div class="filter-row">
            <span class="filter-label">Dauer</span>
            ${durChips}
          </div>
          <div class="filter-row">
            <span class="filter-label">Energie</span>
            ${engChips}
            ${isFiltered ? `<button class="btn-reset" id="resetFilters">Zurücksetzen</button>` : ''}
          </div>
        </div>`;
    }

    function renderOutings() {
      const list = applyFilters(S.weather);

      if (!list.length) {
        return `
          <div class="empty-state">
            <span class="es-icon">🔍</span>
            <p style="font-weight:600;margin-bottom:.35rem">Keine Ausflüge gefunden</p>
            <p style="font-size:.85rem">Passt die Filter an oder setzt sie zurück.</p>
          </div>`;
      }

      const cards = list.map((o, idx) => renderCard(o, idx)).join('');

      return `
        <div>
          <div class="outings-header">
            <span class="section-title">Ausflugstipps</span>
            <span class="count-pill">${list.length} Vorschläge</span>
          </div>
          <div class="outings-grid">${cards}</div>
        </div>`;
    }

    function renderCard(o, idx) {
      const t = tier(o.score);
      const isFav = S.favorites.includes(o.id);
      const tip = o.tips[o.score % o.tips.length];
      const tagsHtml = o.tags.map(tag =>
        `<span class="tag ${tag === 'kostenlos' ? 'free' : ''}">${tag}</span>`
      ).join('');
      const delay = Math.min(idx * 0.04, 0.6);

      return `
        <div class="outing-card tier-${t}" style="animation-delay:${delay}s" data-id="${o.id}">
          <div class="card-header">
            <span class="card-icon">${o.icon}</span>
            <div class="card-title-wrap">
              <div class="card-title">${o.title}</div>
              <span class="score-pill ${t}">${scoreLabel(o.score)}</span>
            </div>
            <button class="fav-btn ${isFav ? 'on' : ''}" data-fav="${o.id}" title="Als Favorit markieren">
              ${isFav ? '★' : '☆'}
            </button>
          </div>
          <div class="card-desc">${o.desc}</div>
          <div class="card-tags">${tagsHtml}</div>
          <div class="card-meta">
            <span class="meta-item">${DURATION_MAP[o.duration]}</span>
            <span class="meta-item">${ENERGY_MAP[o.energy]}</span>
            ${o.category === 'outdoor' ? '<span class="meta-item">🌿 Draußen</span>' : ''}
            ${o.category === 'indoor'  ? '<span class="meta-item">🏠 Drinnen</span>'  : ''}
          </div>
          <div class="card-tip">
            <span class="tip-icon">💡</span>
            <span>${tip}</span>
          </div>
        </div>`;
    }

    function renderLocBar(source) {
      const name = S.location?.name || '';
      const icon = source === 'gps' ? '📡' : '📍';
      let tag = '', sub = '';

      if (source === 'gps') {
        tag = '<span class="loc-source-tag gps">GPS</span>';
        sub = 'Aktueller Standort';
      } else if (source === 'default') {
        tag = '<span class="loc-source-tag">Beispielort</span>';
        sub = 'Oben eigenen Ort eingeben';
      } else {
        sub = 'Manuell ausgewählt';
      }

      return `
        <div class="loc-bar">
          <span class="loc-bar-icon">${icon}</span>
          <div class="loc-bar-info">
            <span class="loc-bar-name">${escHtml(name)}</span>
            <span class="loc-bar-sub">${sub}</span>
          </div>
          ${tag}
          <button class="loc-bar-change" id="locBarChange">Ort ändern</button>
        </div>`;
    }

    function renderGeoCta() {
      return `
        <div class="geo-cta">
          <span class="geo-cta-icon">📡</span>
          <div class="geo-cta-body">
            <div class="geo-cta-title">Meinen Standort verwenden</div>
            <div class="geo-cta-sub">Passgenaue Ausflugstipps für deinen echten Ort – einmalige Zustimmung genügt.</div>
          </div>
          <button class="geo-cta-btn" id="geoCta">Standort ermitteln</button>
        </div>`;
    }

    /* ================================================================
       EVENT BINDING
    ================================================================ */
    function bindDynamic() {
      // Filter chips
      document.querySelectorAll('.chip').forEach(el => {
        el.addEventListener('click', () => {
          S.filter[el.dataset.fkey] = el.dataset.fval;
          render();
        });
      });

      // Error close
      const errClose = document.getElementById('errClose');
      if (errClose) errClose.addEventListener('click', () => { S.error = null; render(); });

      // Forecast day
      document.querySelectorAll('.fc-day').forEach(el => {
        el.addEventListener('click', () => {
          const i = +el.dataset.day;
          S.activeDay = i;
          S.weather = parseWeather(S.weatherRaw, i);
          render();
        });
      });

      // Shuffle
      const shuffleBtn = document.getElementById('shuffleBtn');
      if (shuffleBtn) {
        shuffleBtn.addEventListener('click', () => {
          S.seed = (Math.random() * 1e9) | 0;
          shuffleBtn.classList.add('spinning');
          setTimeout(() => shuffleBtn?.classList.remove('spinning'), 500);
          render();
        });
      }

      // Reset filters
      const resetBtn = document.getElementById('resetFilters');
      if (resetBtn) {
        resetBtn.addEventListener('click', () => {
          S.filter = { type: 'all', duration: 'all', energy: 'all' };
          render();
        });
      }

      // Geo CTA button (in main content area)
      const geoCta = document.getElementById('geoCta');
      if (geoCta) {
        geoCta.addEventListener('click', () => requestGeo(geoCta));
      }

      // "Ort ändern" in location bar
      const locBarChange = document.getElementById('locBarChange');
      if (locBarChange) {
        locBarChange.addEventListener('click', () => {
          window.scrollTo({ top: 0, behavior: 'smooth' });
          setTimeout(() => {
            const inp = document.getElementById('locInput');
            inp.focus();
            inp.select();
          }, 200);
        });
      }

      // Favorites
      document.querySelectorAll('.fav-btn').forEach(btn => {
        btn.addEventListener('click', e => {
          e.stopPropagation();
          const id = btn.dataset.fav;
          if (S.favorites.includes(id)) {
            S.favorites = S.favorites.filter(f => f !== id);
          } else {
            S.favorites.push(id);
          }
          localStorage.setItem('fav_v1', JSON.stringify(S.favorites));
          btn.textContent = S.favorites.includes(id) ? '★' : '☆';
          btn.classList.toggle('on', S.favorites.includes(id));
        });
      });
    }

    /* ================================================================
       GEOLOCATION (shared helper – only triggered by explicit click)
    ================================================================ */
    function requestGeo(btn) {
      if (!navigator.geolocation) {
        S.error = 'Standortermittlung wird von diesem Browser nicht unterstützt. Bitte Ort manuell eingeben.';
        render();
        return;
      }
      const originalText = btn.textContent.trim();
      btn.textContent = '⏳ Ermitteln…';
      btn.disabled = true;

      navigator.geolocation.getCurrentPosition(
        async pos => {
          const { latitude: lat, longitude: lon } = pos.coords;
          try {
            const name = await reverseGeocode(lat, lon);
            setLocation({ name, lat, lon }, 'gps');
          } catch {
            setLocation({ name: 'Mein Standort', lat, lon }, 'gps');
          }
          // btn may be gone after re-render – no need to reset it
        },
        err => {
          btn.textContent = originalText;
          btn.disabled = false;
          if (err.code === 1) {
            S.error = 'Standortzugriff verweigert. Bitte Ort im Suchfeld oben eingeben.';
          } else {
            S.error = 'Standort konnte nicht ermittelt werden. Bitte Ort manuell eingeben.';
          }
          render();
        },
        { timeout: 10000 }
      );
    }

    /* ================================================================
       LOCATION INPUT & AUTOCOMPLETE
    ================================================================ */
    let acTimeout = null;

    function bindHeader() {
      const input   = document.getElementById('locInput');
      const acList  = document.getElementById('acList');
      const searchB = document.getElementById('searchBtn');
      const geoB    = document.getElementById('geoBtn');

      input.addEventListener('input', () => {
        clearTimeout(acTimeout);
        const v = input.value.trim();
        if (v.length < 2) { acList.style.display = 'none'; return; }
        acTimeout = setTimeout(() => loadAC(v), 280);
      });

      input.addEventListener('keydown', e => {
        if (e.key === 'Enter') doSearch(input.value.trim());
      });

      searchB.addEventListener('click', () => doSearch(input.value.trim()));

      // Geo button in header: only fires on explicit click, never on load
      geoB.addEventListener('click', () => requestGeo(geoB));

      document.addEventListener('click', e => {
        if (!e.target.closest('.loc-wrap')) acList.style.display = 'none';
      });
    }

    async function loadAC(query) {
      try {
        const results = await geocode(query);
        const acList  = document.getElementById('acList');
        if (!results.length) { acList.style.display = 'none'; return; }
        acList.innerHTML = results.map((r, i) => `
          <div class="ac-item" data-idx="${i}">
            📍 ${escHtml(r.name)}${r.admin1 ? ', ' + escHtml(r.admin1) : ''}${r.country ? ' · ' + escHtml(r.country) : ''}
          </div>`).join('');
        acList.style.display = 'block';
        acList.querySelectorAll('.ac-item').forEach(el => {
          el.addEventListener('click', () => {
            const r = results[+el.dataset.idx];
            const name = r.name + (r.admin1 ? ', ' + r.admin1 : '');
            setLocation({ name, lat: r.latitude, lon: r.longitude });
            acList.style.display = 'none';
          });
        });
      } catch { /* ignore AC errors */ }
    }

    async function doSearch(query) {
      if (!query) return;
      document.getElementById('acList').style.display = 'none';
      try {
        const results = await geocode(query);
        if (!results.length) {
          S.error = `"${query}" wurde nicht gefunden. Bitte anders eingeben.`;
          render();
          return;
        }
        const r = results[0];
        setLocation({ name: r.name + (r.admin1 ? ', ' + r.admin1 : ''), lat: r.latitude, lon: r.longitude });
      } catch {
        S.error = 'Suche fehlgeschlagen. Bitte Internetverbindung prüfen.';
        render();
      }
    }

    async function setLocation(loc, source = 'manual') {
      S.location  = { ...loc, source };
      S.activeDay = 0;
      S.error     = null;
      localStorage.setItem('lastLoc_v1', JSON.stringify(S.location));
      document.getElementById('locInput').value = loc.name;
      await loadWeatherData();
    }

    async function loadWeatherData() {
      if (!S.location) return;
      S.loading = true;
      S.error   = null;
      render();
      try {
        const raw  = await fetchWeather(S.location.lat, S.location.lon);
        S.weatherRaw = raw;
        S.weather    = parseWeather(raw, 0);
        S.forecast   = parseForecast(raw);
        S.loading    = false;
        render();
      } catch (e) {
        S.loading = false;
        S.error   = e.message || 'Wetterdaten konnten nicht geladen werden.';
        render();
      }
    }

    /* ================================================================
       UTILS
    ================================================================ */
    function escHtml(s) {
      return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
    }

    /* ================================================================
       INIT
    ================================================================ */
    async function loadDefaultLocation() {
      // Nürnberg as built-in example — no geolocation triggered
      await setLocation(
        { name: 'Nürnberg, Bayern', lat: 49.4521, lon: 11.0767 },
        'default'
      );
    }

    function init() {
      bindHeader();

      const saved = localStorage.getItem('lastLoc_v1');
      if (saved) {
        try {
          const loc = JSON.parse(saved);
          // Restore last explicitly chosen location (manual or GPS from a previous session)
          S.location = loc;
          document.getElementById('locInput').value = loc.name;
          loadWeatherData();
        } catch {
          loadDefaultLocation();
        }
      } else {
        // First visit: start with Nürnberg so the app is immediately usable
        loadDefaultLocation();
      }
    }

    init();
  </script>
</body>
</html>
