<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#0077CC" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#0A0A0E" media="(prefers-color-scheme: dark)">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="SpotterDex">
  <meta name="description" content="Digitales Handbuch für Planespotter — Flugzeuge erkennen, vergleichen und meistern.">
  <title>SpotterDex</title>
  <link rel="manifest" href="manifest.json">
  <link rel="apple-touch-icon" href="apple-touch-icon.png">
  <link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- Main content -->
  <div id="app"></div>

  <!-- Bottom tab bar -->
  <nav id="tab-bar">
    <button class="tab active" data-tab="database" aria-label="Datenbank">
      <svg viewBox="0 0 24 24"><rect x="2" y="4" width="20" height="4" rx="1.5"/><rect x="2" y="10" width="20" height="4" rx="1.5"/><rect x="2" y="16" width="20" height="4" rx="1.5"/></svg>
      <span>Datenbank</span>
    </button>
    <button class="tab" data-tab="compare" aria-label="Vergleich">
      <svg viewBox="0 0 24 24"><path d="M9 18 3 12l6-6M15 6l6 6-6 6"/></svg>
      <span>Vergleich</span>
    </button>
    <button class="tab" data-tab="quiz" aria-label="Quiz">
      <svg viewBox="0 0 24 24"><path d="M9 18h6M10 22h4"/><path d="M12 2a7 7 0 0 0-4 12.7c.6.5 1 1.3 1 2.3h6c0-1 .4-1.8 1-2.3A7 7 0 0 0 12 2z"/></svg>
      <span>Quiz</span>
    </button>
    <button class="tab" data-tab="info" aria-label="Info">
      <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><path d="M12 16v-4M12 8h.01"/></svg>
      <span>Info</span>
    </button>
  </nav>

  <!-- Detail slide-in overlay -->
  <div id="detail-overlay"></div>

  <!-- Aircraft picker sheet (for Compare) -->
  <div id="picker-sheet" aria-modal="true" role="dialog" aria-label="Flugzeug auswählen">
    <div id="picker-backdrop"></div>
    <div class="picker-panel">
      <div class="picker-handle"></div>
      <p class="picker-title">Flugzeug auswählen</p>
      <div class="picker-search-bar">
        <svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35"/></svg>
        <input type="search" id="picker-input" placeholder="Suchen…" autocomplete="off" autocorrect="off">
      </div>
      <div id="picker-list"></div>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
